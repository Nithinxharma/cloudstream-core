name: Build CloudStream Core AAR

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Library (AAR)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Core AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-core-aar
          path: app/build/outputs/aar/*.aar
          retention-days: 7
