name: Android CI (AAR Library)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

  build-aar:
    name: Build AAR Packages
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble Headless AAR Libraries
        run: ./gradlew :app:assembleDebug :app:assembleRelease :library:assemble :shared:assemble --stacktrace

      - name: List Generated AAR Artifacts
        run: |
          echo "=== Generated AAR Packages ==="
          find . -name "*.aar" -type f -exec ls -lh {} +

      - name: Upload App Headless AAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-app-aar
          path: app/build/outputs/aar/*.aar
          retention-days: 14

      - name: Upload All AAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-all-aars
          path: |
            **/build/outputs/aar/*.aar
            library/build/outputs/aar/*.aar
            shared/build/outputs/aar/*.aar
          retention-days: 14
